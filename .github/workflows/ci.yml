name: CI

on:
  push:
    branches: [Neuro-Voice]
  pull_request:
    branches: [Neuro-Voice]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run hermetic unit tests
        run: pytest -q

      - name: Verify notebook generator is reproducible
        run: |
          cp notebooks/education_guide.ipynb /tmp/education_guide.ipynb
          python generate_notebook.py
          cmp /tmp/education_guide.ipynb notebooks/education_guide.ipynb

  frontend:
    name: Frontend - syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: node --check frontend/app.js
